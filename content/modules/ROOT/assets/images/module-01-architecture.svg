<svg xmlns="http://www.w3.org/2000/svg" width="848" height="572" viewBox="0 0 848 572" role="img" aria-labelledby="t d">
<title id="t">Where the control plane runs on EKS, AKS, ROSA HCP and ARO</title>
<desc id="d">Four panels. EKS and AKS run the control plane in an account the cloud provider owns, and your nodes run in your account. ROSA with hosted control planes runs the control plane in a Red Hat-owned AWS account, reached over AWS PrivateLink. ARO runs control plane and worker VMs in a managed resource group in your subscription, locked by a deny assignment.</desc>
