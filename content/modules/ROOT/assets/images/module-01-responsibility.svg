<svg xmlns="http://www.w3.org/2000/svg" width="902" height="456" viewBox="0 0 902 456" role="img" aria-labelledby="t d">
<title id="t">Who is responsible for what on EKS, AKS, ROSA HCP and ARO</title>
<desc id="d">Control plane and etcd: Amazon EKS AWS, Azure AKS Microsoft, ROSA HCP Red Hat SRE, ARO Microsoft + SRE. Node operating system: Amazon EKS AWS + you, Azure AKS Microsoft + you, ROSA HCP SRE + you, ARO MS + SRE + you. Platform components: Amazon EKS You (add-ons), Azure AKS Microsoft + you, ROSA HCP Red Hat SRE, ARO Microsoft + SRE. Cluster upgrades: Amazon EKS You, Azure AKS Microsoft + you, ROSA HCP SRE + you, ARO MS + SRE + you. Node capacity: Amazon EKS You, Azure AKS You, ROSA HCP You, ARO You. Identity and access: Amazon EKS You, Azure AKS You, ROSA HCP You, ARO You. App backup and data: Amazon EKS You, Azure AKS You, ROSA HCP You, ARO You. Your workloads: Amazon EKS You, Azure AKS You, ROSA HCP You, ARO You.</desc>
