<text x="20" y="26" font-family="Red Hat Text, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1e" text-anchor="start">Platform cost per month on top of worker compute</text>
<text x="20" y="46" font-family="Red Hat Text, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">3 workers with 4 vCPU each, 730 hours, list prices on 2026-10-14</text>
