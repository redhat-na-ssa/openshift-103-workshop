<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-labelledby="t d">
<title id="t">Monthly platform cost on top of worker compute, 3 workers with 4 vCPU each</title>
<desc id="d">EKS: about $73 per month; AKS Free: about $0 per month; AKS Standard: about $73 per month; ROSA HCP: about $557 per month; ARO (standard): about $1,215 per month. Worker VM or EC2 cost is the same on every platform and is not shown.</desc>
