<svg xmlns="http://www.w3.org/2000/svg" width="560" height="772" viewBox="0 0 560 772">
<rect x="0" y="0" width="560" height="772" fill="#ffffff"/>
<text x="16" y="30" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#151515">Why my pod failed on OpenShift</text>
<rect x="16" y="48" width="528" height="58" rx="6" fill="#fff1f0" stroke="#c9190b" stroke-width="1.5"/>
<text x="280.0" y="72.83333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Deployment shows 0 pods; ReplicaSet event</text>
<text x="280.0" y="89.83333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">FailedCreate: unable to validate against any SCC</text>
<text x="148" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4d5258">Cause</text>
<text x="424" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4d5258">Fix</text>
<line x1="24" y1="106" x2="24" y2="170" stroke="#4d5258" stroke-width="1.4"/>
<line x1="24" y1="170" x2="35" y2="170" stroke="#4d5258" stroke-width="1.6"/><polygon points="42,170 34,165.5 34,174.5" fill="#4d5258"/>
<rect x="44" y="140" width="208" height="60" rx="6" fill="#f3f4f5" stroke="#6a6e73" stroke-width="1.5"/>
<text x="148.0" y="165.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Sets runAsUser to a</text>
<text x="148.0" y="182.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">fixed ID, such as 1000</text>
<line x1="254" y1="170" x2="281" y2="170" stroke="#4d5258" stroke-width="1.6"/><polygon points="288,170 280,165.5 280,174.5" fill="#4d5258"/>
<rect x="290" y="140" width="254" height="60" rx="6" fill="#eef6ec" stroke="#3e8635" stroke-width="1.5"/>
<text x="417.0" y="165.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Remove it, or set</text>
<text x="417.0" y="182.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">hostUsers: false (restricted-v3)</text>
<line x1="24" y1="106" x2="24" y2="244" stroke="#4d5258" stroke-width="1.4"/>
<line x1="24" y1="244" x2="35" y2="244" stroke="#4d5258" stroke-width="1.6"/><polygon points="42,244 34,239.5 34,248.5" fill="#4d5258"/>
<rect x="44" y="214" width="208" height="60" rx="6" fill="#f3f4f5" stroke="#6a6e73" stroke-width="1.5"/>
<text x="148.0" y="239.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Asks for privileged,</text>
<text x="148.0" y="256.83333333333337" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">hostPath or hostNetwork</text>
<line x1="254" y1="244" x2="281" y2="244" stroke="#4d5258" stroke-width="1.6"/><polygon points="288,244 280,239.5 280,248.5" fill="#4d5258"/>
<rect x="290" y="214" width="254" height="60" rx="6" fill="#eef6ec" stroke="#3e8635" stroke-width="1.5"/>
<text x="417.0" y="239.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Rethink the design, or</text>
<text x="417.0" y="256.83333333333337" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">a narrow custom SCC</text>
<line x1="24" y1="106" x2="24" y2="318" stroke="#4d5258" stroke-width="1.4"/>
<line x1="24" y1="318" x2="35" y2="318" stroke="#4d5258" stroke-width="1.6"/><polygon points="42,318 34,313.5 34,322.5" fill="#4d5258"/>
<rect x="44" y="288" width="208" height="60" rx="6" fill="#f3f4f5" stroke="#6a6e73" stroke-width="1.5"/>
<text x="148.0" y="313.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Adds capabilities</text>
<text x="148.0" y="330.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">such as SYS_ADMIN</text>
<line x1="254" y1="318" x2="281" y2="318" stroke="#4d5258" stroke-width="1.6"/><polygon points="288,318 280,313.5 280,322.5" fill="#4d5258"/>
<rect x="290" y="288" width="254" height="60" rx="6" fill="#eef6ec" stroke="#3e8635" stroke-width="1.5"/>
<text x="417.0" y="313.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Drop them; only</text>
<text x="417.0" y="330.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">NET_BIND_SERVICE is allowed</text>
<rect x="16" y="378" width="528" height="58" rx="6" fill="#fff1f0" stroke="#c9190b" stroke-width="1.5"/>
<text x="280.0" y="402.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Pod is created, then CrashLoopBackOff</text>
<text x="280.0" y="419.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">with Permission denied in the logs</text>
<text x="148" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4d5258">Cause</text>
<text x="424" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4d5258">Fix</text>
<line x1="24" y1="436" x2="24" y2="500" stroke="#4d5258" stroke-width="1.4"/>
<line x1="24" y1="500" x2="35" y2="500" stroke="#4d5258" stroke-width="1.6"/><polygon points="42,500 34,495.5 34,504.5" fill="#4d5258"/>
<rect x="44" y="470" width="208" height="60" rx="6" fill="#f3f4f5" stroke="#6a6e73" stroke-width="1.5"/>
<text x="148.0" y="495.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Writes to a directory</text>
<text x="148.0" y="512.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">owned by root</text>
<line x1="254" y1="500" x2="281" y2="500" stroke="#4d5258" stroke-width="1.6"/><polygon points="288,500 280,495.5 280,504.5" fill="#4d5258"/>
<rect x="290" y="470" width="254" height="60" rx="6" fill="#eef6ec" stroke="#3e8635" stroke-width="1.5"/>
<text x="417.0" y="495.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">chgrp -R 0 and</text>
<text x="417.0" y="512.8333333333333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">chmod -R g=u in the image</text>
<line x1="24" y1="436" x2="24" y2="574" stroke="#4d5258" stroke-width="1.4"/>
<line x1="24" y1="574" x2="35" y2="574" stroke="#4d5258" stroke-width="1.6"/><polygon points="42,574 34,569.5 34,578.5" fill="#4d5258"/>
<rect x="44" y="544" width="208" height="60" rx="6" fill="#f3f4f5" stroke="#6a6e73" stroke-width="1.5"/>
<text x="148.0" y="569.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Expects to run as a</text>
<text x="148.0" y="586.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">named user or root</text>
<line x1="254" y1="574" x2="281" y2="574" stroke="#4d5258" stroke-width="1.6"/><polygon points="288,574 280,569.5 280,578.5" fill="#4d5258"/>
<rect x="290" y="544" width="254" height="60" rx="6" fill="#eef6ec" stroke="#3e8635" stroke-width="1.5"/>
<text x="417.0" y="569.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Run as any UID in group 0;</text>
<text x="417.0" y="586.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">set HOME in the image</text>
<line x1="24" y1="436" x2="24" y2="648" stroke="#4d5258" stroke-width="1.4"/>
<line x1="24" y1="648" x2="35" y2="648" stroke="#4d5258" stroke-width="1.6"/><polygon points="42,648 34,643.5 34,652.5" fill="#4d5258"/>
<rect x="44" y="618" width="208" height="60" rx="6" fill="#f3f4f5" stroke="#6a6e73" stroke-width="1.5"/>
<text x="148.0" y="643.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Reads files only</text>
<text x="148.0" y="660.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">its own user can read</text>
<line x1="254" y1="648" x2="281" y2="648" stroke="#4d5258" stroke-width="1.6"/><polygon points="288,648 280,643.5 280,652.5" fill="#4d5258"/>
<rect x="290" y="618" width="254" height="60" rx="6" fill="#eef6ec" stroke="#3e8635" stroke-width="1.5"/>
<text x="417.0" y="643.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">Make them group-0</text>
<text x="417.0" y="660.8333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#151515">readable in the image</text>
<text x="16" y="712" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#4d5258">Granting the anyuid SCC fixes only the fixed-ID and root-only causes, by running</text>
<text x="16" y="730" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#4d5258">the container as root. It does not allow privileged pods, host access or extra</text>
<text x="16" y="748" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#4d5258">capabilities. Use it as a last resort.</text>
</svg>
