name: Sample App Image

on:
  push:
    branches: [main]
    paths:
      - "sample-app/**"
      - ".github/workflows/sample-app-image.yml"
  pull_request:
    paths:
      - "sample-app/**"
      - ".github/workflows/sample-app-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}/sample-app
  VERSION: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: nonroot
            suffix: ""
          - target: root
            suffix: "-root"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only build, to prove the image still builds.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sample-app
          file: sample-app/Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OpenShift 103 Workshop sample app (${{ matrix.target }})
