name: Build and Release PDF Documentation
# Builds the PDF and publishes the release with the shared workflow in shpwrck/workshop-common.
on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write  # create the release and upload the PDF

jobs:
  release:
    uses: shpwrck/workshop-common/.github/workflows/pdf-release.yml@main
    with:
      tag-name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
      pdf-name: openshift-cloud-workshop
      pdf-title: OpenShift Cloud Workshop
