---
site:
  title: OpenShift Cloud Workshop
  url: "https://shpwrck.github.io/ocp-cloud-workshop"
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: css/site-extra.css
      contents: ./content/supplemental-ui/css/site-extra.css
    - path: partials/head-meta.hbs
      contents: ./content/supplemental-ui/partials/head-meta.hbs
    - path: partials/footer.hbs
      contents: ./content/supplemental-ui/partials/footer.hbs
    - path: partials/build-info.hbs
      contents: ./content/supplemental-ui/partials/build-info.hbs
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www
