---
site:
  title: OpenShift Cloud Workshop
  url: "https://redhat-na-ssa.github.io/openshift-cloud-workshop"
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    # Showroom theme plus the shared workshop CSS, tabs, copy buttons and footer stamp;
    # see https://github.com/shpwrck/workshop-common
    url: https://github.com/shpwrck/workshop-common/releases/download/ui-bundle/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

asciidoc:
  extensions:
    - '@asciidoctor/tabs'

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www
