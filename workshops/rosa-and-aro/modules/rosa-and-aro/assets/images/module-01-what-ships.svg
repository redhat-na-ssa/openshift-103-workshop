<svg xmlns="http://www.w3.org/2000/svg" width="830" height="424" viewBox="0 0 830 424" role="img" aria-labelledby="t d">
<title id="t">How platform capabilities arrive on ROSA and ARO</title>
<desc id="d">Three columns. Ships and upgraded with the cluster: pod network, cluster DNS, ingress router, block storage with a default class, image registry, metrics and alerts, web console. Ships, you configure it: node autoscaling through machine pools, ingress settings through the IngressController on ARO, identity providers through OAuth. From the Software Catalog, which you add and run: OpenShift GitOps, Logging, the EFS CSI Driver on ROSA, and OADP for backup.</desc>
