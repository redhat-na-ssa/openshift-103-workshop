<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" font-family="Red Hat Text, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="960" height="454" fill="#ffffff"/>
<rect x="10" y="10" width="940" height="86" rx="8" fill="#f7f8fa" stroke="#d9dee5"/>
<text x="26" y="58.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">EKS</text>
<rect x="130" y="20" width="190" height="66" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="225.0" y="49.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Check upgrade insights</text>
<text x="225.0" y="65.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">and add-on versions</text>
