<text x="433.0" y="137.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Control plane, managed</text>
<text x="433.0" y="153.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">add-ons, node pools</text>
<text x="433.0" y="169.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">(channel or az aks upgrade)</text>
<line x1="320" y1="149.0" x2="336" y2="149.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="546" y="116" width="190" height="66" rx="6" fill="#eef0f3" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="641.0" y="145.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Node OS image</text>
<text x="641.0" y="161.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">(node OS channel)</text>
<line x1="528" y1="149.0" x2="544" y2="149.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="10" y="202" width="940" height="86" rx="8" fill="#f7f8fa" stroke="#d9dee5"/>
<text x="26" y="250.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">ROSA</text>
<rect x="130" y="212" width="190" height="66" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="225.0" y="233.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Pick channel, version</text>
<text x="225.0" y="249.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">and time</text>
<text x="225.0" y="265.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">(rosa or OCM)</text>
<rect x="338" y="212" width="190" height="66" rx="6" fill="#eef0f3" stroke="#7b8794" stroke-width="1.5"/>
<text x="433.0" y="233.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Control plane and all</text>
<text x="433.0" y="249.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">platform Operators</text>
<text x="433.0" y="265.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">(Red Hat runs it)</text>
<line x1="320" y1="245.0" x2="336" y2="245.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="546" y="212" width="190" height="66" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="641.0" y="233.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Each machine pool:</text>
<text x="641.0" y="249.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">node OS and kubelet</text>
<text x="641.0" y="265.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">(may trail 2 minors)</text>
<line x1="528" y1="245.0" x2="544" y2="245.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="10" y="298" width="940" height="86" rx="8" fill="#f7f8fa" stroke="#d9dee5"/>
<text x="26" y="346.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">ARO</text>
<rect x="130" y="308" width="190" height="66" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="225.0" y="329.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Pick channel, start</text>
<text x="225.0" y="345.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">the update (oc, console</text>
<text x="225.0" y="361.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">or UpgradeConfig)</text>
<rect x="338" y="308" width="190" height="66" rx="6" fill="#eef0f3" stroke="#7b8794" stroke-width="1.5"/>
<text x="433.0" y="329.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Control plane, Operators,</text>
<text x="433.0" y="345.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">then workers roll:</text>
<text x="433.0" y="361.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">one release payload</text>
<line x1="320" y1="341.0" x2="336" y2="341.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="26" y="412" width="22" height="16" rx="3" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="56" y="425" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2933">You start or run this step</text>
<rect x="326" y="412" width="22" height="16" rx="3" fill="#eef0f3" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="356" y="425" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2933">Automatic if you opt in to a channel</text>
<rect x="626" y="412" width="22" height="16" rx="3" fill="#eef0f3" stroke="#7b8794" stroke-width="1.5"/>
<text x="656" y="425" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2933">Runs on its own once started</text>
</svg>
