<text x="225.0" y="137.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Pick upgrade channels</text>
<text x="225.0" y="153.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">and a maintenance</text>
<text x="225.0" y="169.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">window, once</text>
