<text x="433.0" y="49.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Upgrade control plane</text>
<text x="433.0" y="65.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">one minor version</text>
<line x1="320" y1="53.0" x2="336" y2="53.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="546" y="20" width="190" height="66" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="641.0" y="41.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Update each add-on:</text>
<text x="641.0" y="57.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">CNI, CoreDNS, kube-proxy,</text>
<text x="641.0" y="73.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">CSI, LB controller</text>
<line x1="528" y1="53.0" x2="544" y2="53.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="754" y="20" width="190" height="66" rx="6" fill="#dbe8f8" stroke="#2a78d6" stroke-width="1.5"/>
<text x="849.0" y="41.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">Roll node groups</text>
<text x="849.0" y="57.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">to new AMIs</text>
<text x="849.0" y="73.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2933">(Auto Mode: automatic)</text>
<line x1="736" y1="53.0" x2="752" y2="53.0" stroke="#52606d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="10" y="106" width="940" height="86" rx="8" fill="#f7f8fa" stroke="#d9dee5"/>
<text x="26" y="154.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">AKS</text>
